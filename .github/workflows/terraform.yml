name: 'Terraform CI/CD'

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.5'

      - name: Write Snowflake private key
        run: |
          mkdir -p "$HOME/.snowflake"
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$HOME/.snowflake/rsa_key.p8"
          chmod 600 "$HOME/.snowflake/rsa_key.p8"

      - name: Create tfvars
        run: |
          cat <<'TFVARS' > terraform.tfvars
          aws_region              = "eu-central-1"
          project_name            = "food-sharing-map"
          environment             = "prod"
          snowflake_organization_name = "${{ secrets.SNOWFLAKE_ORG_NAME }}"
          snowflake_account_name      = "${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}"
          snowflake_username          = "${{ secrets.SNOWFLAKE_USERNAME }}"
          snowflake_private_key_path  = "$HOME/.snowflake/rsa_key.p8"
          snowflake_role              = "ACCOUNTADMIN"
          TFVARS

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
