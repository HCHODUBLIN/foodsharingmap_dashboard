version: 2

models:
  - name: fct_activity_distribution
    description: >
      Aggregated view of food sharing activities by type.
      Used for Dashboard Tile 1: activity type distribution chart.
    columns:
      - name: activity_type
        description: "Food sharing activity category"
        tests:
          - unique
          - not_null
      - name: initiative_count
        description: "Number of distinct initiatives with this activity"
      - name: pct_of_total
        description: "Percentage of total initiatives"

  - name: fct_geo_distribution
    description: >
      Geographic distribution of initiatives at country/city level.
      Used for Dashboard Tile 2: geographic distribution map and charts.
    columns:
      - name: country
        description: "Country name"
        tests:
          - not_null
      - name: city
        description: "City name"
      - name: initiative_count
        description: "Number of initiatives in this country/city"

  - name: fct_country_summary
    description: >
      Country-level summary with centroids for map visualization.
    columns:
      - name: country
        description: "Country name"
        tests:
          - unique
          - not_null
      - name: total_initiatives
        description: "Total initiatives in the country"
