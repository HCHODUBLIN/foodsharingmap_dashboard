version: 2

models:
  - name: stg_initiatives
    description: "Cleaned initiative data extracted from raw JSON (latest snapshot only)"
    columns:
      - name: initiative_id
        description: "Unique identifier for each food sharing initiative"
        tests:
          - unique
          - not_null
      - name: initiative_name
        description: "Name of the initiative"
        tests:
          - not_null
      - name: country
        description: "Country where the initiative operates"
      - name: city
        description: "City where the initiative operates"
      - name: longitude
        description: "Geographic longitude"
      - name: latitude
        description: "Geographic latitude"
